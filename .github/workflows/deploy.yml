name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/project-back:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/project-back:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            mkdir -p /opt/project-back

            cat > /opt/project-back/backend.env << 'EOF'
            SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            FIREBASE_SERVICE_ACCOUNT_JSON=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            IMAGE_UPLOAD_DIR=${{ secrets.IMAGE_UPLOAD_DIR }}
            IMAGE_BASE_URL=${{ secrets.IMAGE_BASE_URL }}
            FRONTEND_ORIGINS=${{ secrets.FRONTEND_ORIGINS }}
            EOF

            chmod 600 /opt/project-back/backend.env

            echo '${{ secrets.DOCKER_HUB_TOKEN }}' | docker login -u '${{ secrets.DOCKER_HUB_USERNAME }}' --password-stdin

            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/project-back:${{ github.sha }}
            docker stop project-back || true
            docker rm project-back || true

            docker run -d \
              --name project-back \
              --restart unless-stopped \
              --env-file /opt/project-back/backend.env \
              -p 8080:8080 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/project-back:${{ github.sha }}

            docker image prune -f
