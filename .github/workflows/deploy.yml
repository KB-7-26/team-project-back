name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/project-back:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/project-back:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            mkdir -p /opt/project-back

            cat > /opt/project-back/backend.env << 'EOF'
            SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            SPRING_JPA_HIBERNATE_DDL_AUTO=${{ secrets.SPRING_JPA_HIBERNATE_DDL_AUTO || 'update' }}
            SPRING_JPA_SHOW_SQL=${{ secrets.SPRING_JPA_SHOW_SQL || 'false' }}
            FIREBASE_SERVICE_ACCOUNT_JSON=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            STORAGE_TYPE=s3
            AWS_REGION=${{ secrets.AWS_REGION || 'ap-northeast-2' }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            S3_OBJECT_PREFIX=${{ secrets.S3_OBJECT_PREFIX || 'uploads' }}
            S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL }}
            APP_CORS_ALLOWED_ORIGIN_PATTERNS=${{ secrets.APP_CORS_ALLOWED_ORIGIN_PATTERNS }}
            EOF

            chmod 600 /opt/project-back/backend.env

            echo '${{ secrets.DOCKER_HUB_TOKEN }}' | docker login -u '${{ secrets.DOCKER_HUB_USERNAME }}' --password-stdin

            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/project-back:${{ github.sha }}
            docker stop project-back || true
            docker rm project-back || true

            docker run -d \
              --name project-back \
              --restart unless-stopped \
              --env-file /opt/project-back/backend.env \
              -p 8080:8080 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/project-back:${{ github.sha }}

            sleep 20
            if ! docker ps --filter "name=project-back" --filter "status=running" --format "{{.Names}}" | grep -q "^project-back$"; then
              docker logs --tail=200 project-back || true
              exit 1
            fi

            docker logs --tail=80 project-back
            docker image prune -f
