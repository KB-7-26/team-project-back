plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'project-back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'com.google.firebase:firebase-admin:9.9.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // Import the AWS SDK BOM to manage versions consistently
    implementation platform('software.amazon.awssdk:bom:2.27.21')
    
    // Core S3 dependency (provides software.amazon.awssdk.services.s3.S3Client)
    implementation 'software.amazon.awssdk:s3'
    
    // Recommended: Optimized Apache HTTP client for production environments
    implementation 'software.amazon.awssdk:apache-client'

    // Import the AWS SDK BOM to manage versions automatically
    implementation platform('software.amazon.awssdk:bom:2.27.21')

    // Add specific AWS service dependencies without version numbers
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:dynamodb'
}

tasks.named('test') {
    useJUnitPlatform()
}

def loadDotEnv(File envFile) {
    if (!envFile.exists()) {
        return [:]
    }

    return envFile.readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') && it.contains('=') }
            .collectEntries { line ->
                def separatorIndex = line.indexOf('=')
                def key = line.substring(0, separatorIndex).trim()
                def value = line.substring(separatorIndex + 1).trim()

                if ((value.startsWith('"') && value.endsWith('"')) ||
                        (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }

                [(key): value]
            }
}

tasks.named('bootRun') {
    environment loadDotEnv(file('.env')).findAll { key, ignored ->
        !System.getenv().containsKey(key)
    }
}
